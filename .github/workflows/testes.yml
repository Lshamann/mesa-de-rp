name: Testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Rodar os testes
        run: sh fonte/testes/rodar_tudo.sh
      - name: Conferir que a build publicada é a do código-fonte
        run: |
          sh fonte/build.sh
          git diff --exit-code -- index.html prosa/index.html || (echo "index.html está diferente da fonte: rode sh fonte/build.sh e faça commit" && exit 1)
